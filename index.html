<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/colors.css" />
    <link rel="stylesheet" href="/src/main.css" />
    <link rel="stylesheet" href="/src/utils.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma11y</title>
  </head>

  <body x-data="{ showFgControls: false, showBgControls: false }" x-effect="document.title = $store.uiStore.t('app.title'); document.documentElement.lang = $store.uiStore.locale">
    <window-resize-grips></window-resize-grips>
    <header>
      <a href="#main" class="skip-link" x-text="$store.uiStore.t('app.skip_navigation')">Skip navigation</a>
      <app-titlebar
      x-bind:app-title="$store.uiStore.t('app.title')">
        <app-menubar slot="menu"></app-menubar>
      </app-titlebar>
    </header>
    <main id="main" tabindex="-1">
      <div class="colors" x-data="{ rotated: false }">
        <!-- Foreground Color -->
        <div class="wrapper" x-bind:style="`background-color: ${$store.uiStore.backgroundHex}`">
          <section id="foreground"
            x-bind:style="`background-color: ${$store.uiStore.foregroundHex}`"
            x-bind:class="$store.uiStore.foregroundIsDark ? 'isDark' : 'isLight'"
          >
            <div
              class="color-preview"
            >
              <h2 id="foreground-title" x-text="$store.uiStore.t('color.foreground')">Foreground</h2>
              <div class="color-input">
                <div class="color-value">
                  <p class="color-name" x-show="$store.uiStore.foregroundName" x-text="$store.uiStore.foregroundName"></p>
                  <input
                    x-data="{ snapshot: '', focused: false }"
                    type="text"
                    class="css-value"
                    x-effect="if (!focused) $el.value = $store.uiStore.foregroundDisplayValue"
                    @focus="focused = true; snapshot = $event.target.value"
                    @input="$store.uiStore.updateColorFromText('foreground', $event.target.value, true)"
                    @keydown.enter="$store.uiStore.updateColorFromText('foreground', $event.target.value)"
                    @keydown.escape="$event.target.value = snapshot; $store.uiStore.updateColorFromText('foreground', snapshot)"
                    @blur="focused = false; $store.uiStore.updateColorFromText('foreground', $event.target.value); if ($store.uiStore.foregroundHexError || !$event.target.value.trim()) { $event.target.value = snapshot; $store.uiStore.updateColorFromText('foreground', snapshot) }"
                    aria-labelledby="foreground-title"
                    :aria-describedby="$store.uiStore.foregroundHexError ? 'foreground-error-message' : null"
                    :aria-invalid="$store.uiStore.foregroundHexError ? 'true' : null"
                    spellcheck="false"
                    autocomplete="off"
                  />
                </div>
                <div role="alert">
                  <p id="foreground-error-message" class="error-message" x-show="$store.uiStore.foregroundHexError">
                    <svg-icon name="warning" size="1em"></svg-icon>
                    <span x-text="$store.uiStore.foregroundHexError"></span>
                  </p>
              </div>
              </div>
            </div>
            <div class="buttons">
              <button
                class="btn invert"
                x-bind:class="{ rotated }"
                @click="$store.uiStore.switchColor(); rotated = !rotated"
                x-bind:disabled="$store.uiStore.isPicking"
                x-bind:aria-label="$store.uiStore.t('color.btn_switch')"
              >
                <svg-icon name="swap"></svg-icon>
              </button>
              <div class="group">
                <button
                  class="btn eyedropper"
                  @click="$store.uiStore.pickColor(true)"
                  x-bind:disabled="$store.uiStore.isPicking"
                  x-bind:aria-label="$store.uiStore.t('color.btn_pick')"
                  aria-describedby="foreground-title"
                >
                  <svg-icon name="eyedropper" size="24px"></svg-icon>
                </button>
                <button
                  class="btn"
                  @click="showFgControls = !showFgControls"
                  x-bind:disabled="$store.uiStore.isPicking"
                  x-bind:aria-label="$store.uiStore.t('color.btn_controls')"
                  aria-describedby="foreground-title"
                  x-bind:aria-expanded="showFgControls"
                >
                  <svg-icon name="sliders"></svg-icon>
                </button>
              </div>
            </div>
          </section>
        </div>
        <!-- Foreground Color controls -->
        <color-controls
          x-show="showFgControls" x-transition
          allow-alpha
          x-bind:alpha="$store.uiStore.foregroundAlpha"
          x-bind:rgb="$store.uiStore.foregroundRgb"
          x-bind:formats="JSON.stringify($store.uiStore.foregroundFormats)"
          x-bind:selected-format="$store.uiStore.foregroundFormat"
          x-bind:locale="$store.uiStore.locale"
          x-bind:label="$store.uiStore.t('color.foreground')"
          @color-change="$store.uiStore.applyColorChange('foreground', $event.detail)"
          @format-change="$store.uiStore.setColorFormat('foreground', $event.detail.format)"
        ></color-controls>
        <!-- Background Color -->
         <div class="wrapper"
            x-bind:style="`background-color: ${showFgControls ? 'transparent' : $store.uiStore.foregroundHex}`">
            <section id="background"
              x-bind:style="`background-color: ${$store.uiStore.backgroundHex}`"
              x-bind:class="$store.uiStore.backgroundIsDark ? 'isDark' : 'isLight'">
              <div
                class="color-preview"
              >
                <h2 id="background-title" x-text="$store.uiStore.t('color.background')">Background</h2>
                <div class="color-input">
                  <div class="color-value">
                    <p class="color-name" x-show="$store.uiStore.backgroundName" x-text="$store.uiStore.backgroundName"></p>
                    <input
                      x-data="{ snapshot: '', focused: false }"
                      type="text"
                      class="css-value"
                      x-effect="if (!focused) $el.value = $store.uiStore.backgroundDisplayValue"
                      @focus="focused = true; snapshot = $event.target.value"
                      @input="$store.uiStore.updateColorFromText('background', $event.target.value, true)"
                      @keydown.enter="$store.uiStore.updateColorFromText('background', $event.target.value)"
                      @keydown.escape="$event.target.value = snapshot; $store.uiStore.updateColorFromText('background', snapshot)"
                      @blur="focused = false; $store.uiStore.updateColorFromText('background', $event.target.value); if ($store.uiStore.backgroundHexError || !$event.target.value.trim()) { $event.target.value = snapshot; $store.uiStore.updateColorFromText('background', snapshot) }"
                      aria-labelledby="background-title"
                      :aria-describedby="$store.uiStore.backgroundHexError ? 'background-error-message' : null"
                      :aria-invalid="$store.uiStore.backgroundHexError ? 'true' : null"
                      spellcheck="false"
                      autocomplete="off"
                    />
                  </div>
                  <div role="alert">
                    <p id="background-error-message" role="alert" class="error-message" x-show="$store.uiStore.backgroundHexError">
                      <svg-icon name="warning" size="1em"></svg-icon>
                      <span x-text="$store.uiStore.backgroundHexError"></span>
                    </p>
                  </div>
                </div>
              </div>
              <div class="buttons">
                <div class="group">
                  <button
                    class="btn eyedropper"
                    @click="$store.uiStore.pickColor(false)"
                    x-bind:disabled="$store.uiStore.isPicking"
                    x-bind:aria-label="$store.uiStore.t('color.btn_pick')"
                    aria-describedby="background-title"
                  >
                    <svg-icon name="eyedropper" size="24px"></svg-icon>
                  </button>
                  <button
                    class="btn"
                    @click="showBgControls = !showBgControls"
                    x-bind:disabled="$store.uiStore.isPicking"
                    x-bind:aria-label="$store.uiStore.t('color.btn_controls')"
                    aria-describedby="background-title"
                    x-bind:aria-expanded="showBgControls"
                  >
                    <svg-icon name="sliders"></svg-icon>
                  </button>
                </div>
              </div>
            </section>
         </div>
        <!-- Background Color controls -->
        <color-controls
          x-show="showBgControls" x-transition
          x-bind:rgb="$store.uiStore.backgroundRgb"
          x-bind:formats="JSON.stringify($store.uiStore.backgroundFormats)"
          x-bind:selected-format="$store.uiStore.backgroundFormat"
          x-bind:locale="$store.uiStore.locale"
          x-bind:label="$store.uiStore.t('color.background')"
          @color-change="$store.uiStore.applyColorChange('background', $event.detail)"
          @format-change="$store.uiStore.setColorFormat('background', $event.detail.format)"
        ></color-controls>
      </div>
      <!-- Contrast Ratio -->
      <section class="results" x-data="{ compact: true }" @toggle-labels="$store.uiStore.toggleProgressLabels()">
        <div class="contrast-ratio" aria-live="polite" aria-atomic="true">
          <p :class="{ 'with-top-border': $store.uiStore.backgroundContrastWithSurrounding < 1.5 || showBgControls }">
            <span class="text" x-text="$store.uiStore.t('results.contrast_ratio')">Contrast Ratio</span>
            <span><strong class="ratio" x-text="$store.uiStore.contrastRatio"></strong>:1</span>
          </p>
        </div>
        <div class="buttons">
          <button
            class="btn small"
            @click="compact = !compact"
            x-bind:aria-label="$store.uiStore.t('results.toggle_details')"
            x-bind:aria-expanded="!compact"
          >
            <svg-icon x-show="!compact" name="chevron-down"></svg-icon>
            <svg-icon x-show="compact" name="chevron-up"></svg-icon>
          </button>
        </div>
        <ul class="progress" x-show="!compact" x-transition>
          <li>
            <div class="label">
              <span x-text="$store.uiStore.t('results.regular_text')">Regular Text</span>
              <span class="fail" x-show="!$store.uiStore.level143Regular" x-text="$store.uiStore.t('results.fail')">FAIL</span>
              <span class="pass" x-show="$store.uiStore.level143Regular && !$store.uiStore.level146Regular" x-text="$store.uiStore.t('results.pass')">PASS</span>
              <span class="pass" x-show="$store.uiStore.level146Regular" x-text="$store.uiStore.t('results.pass')">PASS</span>
            </div>
            <!-- 1.4.3 Regular text 4.5 AA - 7 AAA -->
            <div class="progress-line" aria-hidden="true">
              <span class="icon">
                <svg-icon name="text" size="1.5rem"></svg-icon>
                <svg-icon name="text" size="2.2rem" class="non-active"></svg-icon>
              </span>
              <progress-bar :position="$store.uiStore.contrastRatio" split1="4.5" split2="7" :labels="$store.uiStore.progressLabels"></progress-bar>
              <p class="sr-only" x-text="$store.uiStore.contrastRatio < 4.5 ? $store.uiStore.t('results.below', 4.5) : $store.uiStore.contrastRatio <= 7 ? $store.uiStore.t('results.between', 4.5, 7) : $store.uiStore.t('results.above', 7)"></p>
            </div>
          </li>
          <li>
            <div class="label">
              <span x-text="$store.uiStore.t('results.large_text')">Large Text</span>
              <span class="fail" x-show="!$store.uiStore.level143Large" x-text="$store.uiStore.t('results.fail')">FAIL</span>
              <span class="pass" x-show="$store.uiStore.level143Large && !$store.uiStore.level146Large" x-text="$store.uiStore.t('results.pass')">PASS</span>
              <span class="pass" x-show="$store.uiStore.level146Large" x-text="$store.uiStore.t('results.pass')">PASS</span>
            </div>
            <!-- 1.4.6 Large text 3.1 AA - 4.5 AAA -->
            <div class="progress-line" aria-hidden="true">
              <span class="icon">
                <svg-icon name="text" size="2.2rem"></svg-icon>
                <svg-icon name="text" size="1.5rem" class="non-active"></svg-icon>
              </span>
              <progress-bar :position="$store.uiStore.contrastRatio" split1="3" split2="4.5" :labels="$store.uiStore.progressLabels"></progress-bar>
              <p class="sr-only" x-text="$store.uiStore.contrastRatio < 3 ? $store.uiStore.t('results.below', 3) : $store.uiStore.contrastRatio <= 4.5 ? $store.uiStore.t('results.between', 3, 4.5) : $store.uiStore.t('results.above', 4.5)"></p>
            </div>
          </li>
          <li>
            <div class="label">
              <span x-text="$store.uiStore.t('results.non_text')">Non-text</span>
              <span class="fail" x-show="!$store.uiStore.level1411" x-text="$store.uiStore.t('results.fail')">FAIL</span>
              <span class="pass" x-show="$store.uiStore.level1411" x-text="$store.uiStore.t('results.pass')">PASS</span>
            </div>
            <!-- 1.4.11 Non-text 3.1 AA -->
            <div class="progress-line" aria-hidden="true">
              <span class="icon">
                <svg-icon name="non-text" size="2rem"></svg-icon>
              </span>
              <progress-bar :position="$store.uiStore.contrastRatio" split1="3" :labels="$store.uiStore.progressLabels"></progress-bar>
              <p class="sr-only" x-text="$store.uiStore.contrastRatio < 3 ? $store.uiStore.t('results.below', 3) : $store.uiStore.t('results.above', 3)"></p>
            </div>
          </li>
        </ul>
        <!-- Vue compacte : icônes + pass/fail -->
        <ul class="progress-compact" x-show="compact" x-transition>
          <li class="compact-item">
            <span class="icon" aria-hidden="true">
              <svg-icon name="text" size="1.5rem"></svg-icon>
              <svg-icon name="text" size="2rem" class="non-active"></svg-icon>
            </span>
            <span class="sr-only" x-text="$store.uiStore.t('results.regular_text')">Regular Text</span>
            <span class="fail" x-show="!$store.uiStore.level143Regular" x-text="$store.uiStore.t('results.fail')"></span>
            <span class="pass" x-show="$store.uiStore.level143Regular" x-text="$store.uiStore.t('results.pass')"></span>
          </li>
          <li class="compact-item">
            <span class="icon" aria-hidden="true">
              <svg-icon name="text" size="2rem"></svg-icon>
              <svg-icon name="text" size="1.5rem" class="non-active"></svg-icon>
            </span>
            <span class="sr-only" x-text="$store.uiStore.t('results.large_text')">Large Text</span>
            <span class="fail" x-show="!$store.uiStore.level143Large" x-text="$store.uiStore.t('results.fail')"></span>
            <span class="pass" x-show="$store.uiStore.level143Large" x-text="$store.uiStore.t('results.pass')"></span>
          </li>
          <li class="compact-item">
            <span class="icon" aria-hidden="true">
              <svg-icon name="non-text" size="1.8rem"></svg-icon>
            </span>
            <span class="sr-only" x-text="$store.uiStore.t('results.non_text')">Non-text</span>
            <span class="fail" x-show="!$store.uiStore.level1411" x-text="$store.uiStore.t('results.fail')"></span>
            <span class="pass" x-show="$store.uiStore.level1411" x-text="$store.uiStore.t('results.pass')"></span>
          </li>
        </ul>
      </section>

      <!-- Toast de confirmation copie / Copy confirmation toast -->
      <div id="copy-toast" class="toast" aria-live="polite"></div>

      <!-- ICC Profile Status (debug/info) -->
      <!--section class="icc-status box" x-show="$store.uiStore.platform === 'macos'">
        <p>
          <strong>Colour Profile:</strong>
          <span x-text="$store.uiStore.currentICCProfile"></span>
        </p>
      </section-->
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
