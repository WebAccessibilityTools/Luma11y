<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="/src/colors.css" />
    <link rel="stylesheet" href="/src/common-style.css" />
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body x-data x-effect="
    document.title = $store.settings.t('settings.title');
    document.documentElement.lang = $store.settings.locale;
  "
  @keydown.escape.window="$store.settings.cancel()">
    <window-resize-grips></window-resize-grips>
    <header>
      <app-titlebar x-bind:app-title="$store.settings.t('settings.title')"></app-titlebar>
    </header>
    <main x-data="{
      activeTab: 'general',
      tabs: ['general', 'shortcuts', 'templates'],
      focusTab(id) { this.$root.querySelector(`[role=tab][data-tab=${id}]`)?.focus(); },
      prevTab() { const i = this.tabs.indexOf(this.activeTab); this.activeTab = this.tabs[(i - 1 + this.tabs.length) % this.tabs.length]; this.$nextTick(() => this.focusTab(this.activeTab)); },
      nextTab() { const i = this.tabs.indexOf(this.activeTab); this.activeTab = this.tabs[(i + 1) % this.tabs.length]; this.$nextTick(() => this.focusTab(this.activeTab)); }
    }">

      <!-- Onglets / Tabs -->
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="general"
          id="tab-general" aria-controls="panel-general"
          :aria-selected="activeTab === 'general'"
          :tabindex="activeTab === 'general' ? 0 : -1"
          :class="{ active: activeTab === 'general' }"
          @click="activeTab = 'general'"
          @keydown.arrow-left.prevent="prevTab()"
          @keydown.arrow-right.prevent="nextTab()"
          x-text="$store.settings.t('settings.tab_general')">General</button>
        <button role="tab" data-tab="shortcuts"
          id="tab-shortcuts" aria-controls="panel-shortcuts"
          :aria-selected="activeTab === 'shortcuts'"
          :tabindex="activeTab === 'shortcuts' ? 0 : -1"
          :class="{ active: activeTab === 'shortcuts' }"
          @click="activeTab = 'shortcuts'"
          @keydown.arrow-left.prevent="prevTab()"
          @keydown.arrow-right.prevent="nextTab()"
          x-text="$store.settings.t('settings.tab_shortcuts')">Shortcuts</button>
        <button role="tab" data-tab="templates"
          id="tab-templates" aria-controls="panel-templates"
          :aria-selected="activeTab === 'templates'"
          :tabindex="activeTab === 'templates' ? 0 : -1"
          :class="{ active: activeTab === 'templates' }"
          @click="activeTab = 'templates'"
          @keydown.arrow-left.prevent="prevTab()"
          @keydown.arrow-right.prevent="nextTab()"
          x-text="$store.settings.t('settings.tab_templates')">Copy templates</button>
      </div>

      <!-- Tab : Général / General -->
      <div role="tabpanel" id="panel-general" aria-labelledby="tab-general" x-show="activeTab === 'general'" class="tab-panel">

        <!-- Langue / Language -->
        <div class="section">
          <label for="settings-language" class="section-label" x-text="$store.settings.t('settings.language')">Language</label>
          <div class="field">
            <select id="settings-language"
                :value="$store.settings.preference"
                @change="$store.settings.apply($event.target.value)">
              <option value="auto" x-text="$store.settings.t('settings.auto')">Automatic (system)</option>
              <option value="en">English</option>
              <option value="fr">Français</option>
              <option value="sk">Slovenčina</option>
            </select>
          </div>
        </div>

        <!-- Thème / Theme -->
        <div class="section">
          <label for="settings-theme" class="section-label" x-text="$store.settings.t('settings.theme')">Theme</label>
          <div class="field">
            <select id="settings-theme"
                :value="$store.settings.theme"
                @change="$store.settings.setTheme($event.target.value)">
              <option value="auto" x-text="$store.settings.t('settings.auto')">Automatic (system)</option>
              <option value="light" x-text="$store.settings.t('settings.theme_light')">Light</option>
              <option value="dark" x-text="$store.settings.t('settings.theme_dark')">Dark</option>
            </select>
          </div>
        </div>

        <!-- Thème de style / Style theme -->
        <div class="section">
          <label for="settings-style-theme" class="section-label" x-text="$store.settings.t('settings.style_theme')">Style</label>
          <div class="field">
            <select id="settings-style-theme"
                :value="$store.settings.styleTheme"
                @change="$store.settings.setStyleTheme($event.target.value)">
              <option value="modern" x-text="$store.settings.t('settings.style_modern')">Modern</option>
              <option value="classic" x-text="$store.settings.t('settings.style_classic')">Classic</option>
            </select>
          </div>
        </div>

        <!-- Toast / Notification -->
        <div class="section">
          <label for="settings-toast-duration" class="section-label" x-text="$store.settings.t('settings.toast_duration')">Toast duration</label>
          <div class="field">
            <input id="settings-toast-duration" type="number" min="0" max="30"
              x-model.number="$store.settings.toastDuration"
              aria-describedby="settings-toast-duration-unit"
            />
            <p id="settings-toast-duration-unit" class="field-suffix" x-text="$store.settings.toastDuration === 0 ? $store.settings.t('settings.toast_manual') : $store.settings.t('settings.toast_seconds')"></p>
          </div>
        </div>

        <!-- Formats de couleur / Color formats -->
        <fieldset class="section">
          <legend class="section-label" id="settings-formats-label" x-text="$store.settings.t('settings.color_formats')">Color formats</legend>
          <p class="field-suffix" x-text="$store.settings.t('settings.color_formats_help')"></p>
          <div class="format-toggles">
            <template x-for="fmt in $store.settings.selectableFormats" :key="fmt">
              <label class="format-toggle">
                <input type="checkbox"
                  :checked="$store.settings.enabledFormats.includes(fmt)"
                  @change="$store.settings.toggleFormat(fmt)" />
                <span x-text="$store.settings.t('color.' + fmt)"></span>
              </label>
            </template>
          </div>
        </fieldset>

      </div>

      <!-- Tab : Raccourcis / Shortcuts -->
      <div role="tabpanel" id="panel-shortcuts" aria-labelledby="tab-shortcuts" x-show="activeTab === 'shortcuts'" class="tab-panel">

        <fieldset class="section">
          <legend :id="sc.id" class="section-label" x-text="$store.settings.t('settings.shortcuts')">Keyboard shortcuts</legend>
          <!--
            Capture de raccourci : clic/Entrée/Espace pour entrer en mode "recording",
            puis la prochaine touche non-modificatrice est enregistrée comme raccourci.
            Échap annule l'enregistrement sans fermer la fenêtre.
            Shortcut capture: click/Enter/Space to enter "recording" mode, then the next
            non-modifier key is saved as the shortcut. Escape cancels recording without
            closing the window.
          -->
          <template x-for="(sc, index) in $store.settings.shortcuts" :key="sc.id">
            <div class="shortcut-row" x-data="{ recording: false }">
              <div x-text="$store.settings.t('settings.shortcut_' + sc.id)" aria-hidden="true"></div>
              <div class="shortcut-input"
                tabindex="0"
                role="button"
                :class="{ recording }"
                x-text="recording ? $store.settings.t('settings.press_keys') : sc.key || $store.settings.t('settings.no_shortcut')"
                @click="recording = true; $el.focus()"
                @keydown="if (!recording) { if ($event.key === 'Enter' || $event.key === ' ') { $event.preventDefault(); recording = true; } return; } $event.preventDefault(); if ($event.key === 'Escape') { $event.stopPropagation(); recording = false; return; } if (['Control', 'Alt', 'Shift', 'Meta'].includes($event.key)) return; $store.settings.updateShortcut(index, $event); recording = false"
                @blur="recording = false"
                :aria-label="$store.settings.t('settings.shortcut_' + sc.id) + ' ' + sc.key || $store.settings.t('settings.no_shortcut')"
                :aria-describedby="sc.id"
              ></div>
            </div>
          </template>

        </fieldset>

      </div>

      <!-- Tab : Modèles de copie / Copy templates -->
      <div role="tabpanel" id="panel-templates" aria-labelledby="tab-templates" x-show="activeTab === 'templates'" class="tab-panel">
        <details class="tag-help">
          <summary x-text="$store.settings.t('settings.tag_help_title')">Available tags</summary>
          <dl class="tag-list">
            <dt><code>%f.hex%</code></dt><dd x-text="$store.settings.t('settings.tag_f_hex')"></dd>
            <dt><code>%b.hex%</code></dt><dd x-text="$store.settings.t('settings.tag_b_hex')"></dd>
            <dt><code>%f.hsl%</code></dt><dd x-text="$store.settings.t('settings.tag_f_hsl')"></dd>
            <dt><code>%b.hsl%</code></dt><dd x-text="$store.settings.t('settings.tag_b_hsl')"></dd>
            <dt><code>%f.hsv%</code></dt><dd x-text="$store.settings.t('settings.tag_f_hsv')"></dd>
            <dt><code>%b.hsv%</code></dt><dd x-text="$store.settings.t('settings.tag_b_hsv')"></dd>
            <dt><code>%f.lab%</code></dt><dd x-text="$store.settings.t('settings.tag_f_lab')"></dd>
            <dt><code>%b.lab%</code></dt><dd x-text="$store.settings.t('settings.tag_b_lab')"></dd>
            <dt><code>%f.oklch%</code></dt><dd x-text="$store.settings.t('settings.tag_f_oklch')"></dd>
            <dt><code>%b.oklch%</code></dt><dd x-text="$store.settings.t('settings.tag_b_oklch')"></dd>
            <dt><code>%cr%</code></dt><dd x-text="$store.settings.t('settings.tag_cr')"></dd>
            <dt><code>%crr%</code></dt><dd x-text="$store.settings.t('settings.tag_crr')"></dd>
            <dt><code>%1.4.3%</code></dt><dd x-text="$store.settings.t('settings.tag_1_4_3')"></dd>
            <dt><code>%1.4.6%</code></dt><dd x-text="$store.settings.t('settings.tag_1_4_6')"></dd>
            <dt><code>%1.4.11%</code></dt><dd x-text="$store.settings.t('settings.tag_1_4_11')"></dd>
          </dl>
        </details>
        <div class="template-list">
          <template x-for="(tpl, index) in $store.settings.templates" :key="index">
            <fieldset class="template-item" x-data="{ recording: false, editing: !tpl.name }">
              <div class="template-header">
                <legend class="template" :id="'template-' + index" x-show="!editing" x-text="tpl.name"></legend>
                <legend class="template" :id="'template-' + index + '-new'" x-show="editing" x-text="$store.settings.t('settings.new_template')">New template</legend>
                <button class="btn-remove" @click="$store.settings.removeTemplate(index)" :aria-label="$store.settings.t('settings.remove_template')" :aria-describedby="'template-' + index">&times;</button>
              </div>
              <div class="template-name" x-show="editing">
                <label :for="'template-name' + index" x-text="$store.settings.t('settings.template_name')">Name</label>
                <input type="text" class="template-name"
                  :id="'template-name' + index"
                  x-init="if (editing) $nextTick(() => $el.focus())"
                  @input="$store.settings.templates[index].name = $event.target.value"
                  :placeholder="$store.settings.t('settings.template_name')"
                  @keydown.enter="if ($event.target.value) editing = false"
                  @blur="if ($store.settings.templates[index].name) editing = false"
                  :aria-describedby="'template-' + index"
                />
              </div>
              <div class="template-content">
                <label :for="'template-content' + index" x-text="$store.settings.t('settings.template_content')">Content</label>
                <textarea :id="'template-content' + index" rows="2" :value="tpl.template"
                  @input="$store.settings.templates[index].template = $event.target.value"
                  :aria-describedby="'template-' + index"
                ></textarea>
              </div>
              <!--
                Même logique que la capture de raccourci global ci-dessus, mais pour le
                raccourci de copie d'un modèle.
                Same logic as the global shortcut capture above, but for a template's copy
                shortcut.
              -->
              <div class="template-shortcut">
                <div x-text="$store.settings.t('settings.copy_shortcut')" aria-hidden="true">Shortcut</div>
                <div class="shortcut-input"
                  role="button"
                  tabindex="0"
                  :class="{ recording }"
                  x-text="recording ? $store.settings.t('settings.press_keys') : tpl.shortcut || $store.settings.t('settings.no_shortcut')"
                  @click="recording = true; $el.focus()"
                  @keydown="if (!recording) { if ($event.key === 'Enter' || $event.key === ' ') { $event.preventDefault(); recording = true; } return; } $event.preventDefault(); if ($event.key === 'Escape') { $event.stopPropagation(); recording = false; return; } if (['Control', 'Alt', 'Shift', 'Meta'].includes($event.key)) return; $store.settings.updateTemplateShortcut(index, $event); recording = false"
                  @blur="recording = false"
                  :aria-label="$store.settings.t('settings.copy_shortcut') + ' ' + tpl.shortcut || $store.settings.t('settings.no_shortcut')"
                  :aria-describedby="'template-' + index"
                ></div>
              </div>
            </fieldset>
          </template>
        </div>
        <button class="btn-add" @click="$store.settings.addTemplate()"><span aria-hidden="true">+</span> <span x-text="$store.settings.t('settings.add_template')">Add</span></button>
      </div>
    </main>

    <!-- Barre d'actions fixe / Fixed action bar -->
    <div class="actions">
      <button class="btn-cancel" @click="$store.settings.cancel()" x-text="$store.settings.t('settings.cancel')">Cancel</button>
      <button class="btn-save" @click="$store.settings.save()" x-text="$store.settings.t('settings.save')">Save</button>
    </div>

    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
