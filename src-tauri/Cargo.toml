[package]
name = "luma11y"
version = "0.1.0"
description = "Luma11y"
authors = ["Cédric Trévisan"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "luma11y_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
palette = "0.7"

# =============================================================================
# macOS dependencies
# =============================================================================
[target.'cfg(target_os = "macos")'.dependencies]
# Core Graphics bindings for screen capture
# Provides CGDisplay, CGImage for capturing screen pixels
# Note: We keep this crate because objc2-core-graphics doesn't have all the
# high-level APIs we need for screen capture (CGDisplayCreateImage, etc.)
core-graphics = "0.24"

# Modern Objective-C runtime bindings (objc2 ecosystem)
# Type-safe API for Objective-C interop
objc2 = "0.6"

# Foundation framework bindings
objc2-foundation = { version = "0.3", features = [
    "NSGeometry",        # NSPoint, NSSize, NSRect
    "NSString",          # NSString for text handling
    "NSThread",          # Thread utilities
    "NSArray",           # NSArray collections
    "NSEnumerator",      # Enumeration support
    "NSAffineTransform", # Affine transformations for drawing
    "NSObject",          # Base object class
    "NSDictionary"       # Dictionary for attributes
] }

# AppKit framework bindings for macOS GUI
objc2-app-kit = { version = "0.3", features = [
    "NSWindow",          # Window management
    "NSScreen",          # Screen information
    "NSEvent",           # Event handling
    "NSView",            # View hierarchy
    "NSResponder",       # Event responder chain
    "NSGraphicsContext", # Graphics context
    "NSColor",           # Color handling
    "NSColorSpace",      # Color space
    "NSApplication",     # Application lifecycle
    "NSRunningApplication", # Running app info
    "NSImage",           # Image handling
    "NSBezierPath",      # Vector drawing
    "NSAffineTransform", # Transformations
    "NSCursor",          # Cursor management
    "NSFont",            # Font handling
    "NSStringDrawing",   # String drawing
] }

# =============================================================================
# Windows dependencies
# =============================================================================
[target.'cfg(target_os = "windows")'.dependencies]
# Windows API bindings (official Microsoft crate)
# Uses the latest windows-rs crate for modern Windows API access
# Windows API bindings
windows = { version = "0.58", features = [
    # Core Windows functionality
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    
    # Graphics - GDI for basic drawing
    "Win32_Graphics_Gdi",
    
    # Graphics - GDI+ for anti-aliasing
    "Win32_Graphics_GdiPlus",
    
    # User Interface - Windows and Messages
    "Win32_UI_WindowsAndMessaging",
    
    # Input - Keyboard and Mouse
    "Win32_UI_Input_KeyboardAndMouse",
] }

# =============================================================================
# Linux dependencies
# Dépendances Linux
# =============================================================================
[target.'cfg(target_os = "linux")'.dependencies]
# X11 protocol bindings (pure Rust, no libX11 needed)
# Bindings du protocole X11 (Rust pur, pas besoin de libX11)
# Provides screen capture (GetImage), overlay window, input events
# Fournit la capture d'écran (GetImage), la fenêtre overlay, les événements
x11rb = "0.13"

# Cairo 2D graphics for drawing the magnifier, arcs and text
# Graphismes 2D Cairo pour dessiner la loupe, les arcs et le texte
# Requires system libcairo (libcairo2-dev on Debian/Ubuntu)
# Nécessite libcairo système (libcairo2-dev sur Debian/Ubuntu)
cairo-rs = "0.20"
