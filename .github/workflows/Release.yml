name: Release
on:
  push:
    branches:
      - main
  # Manual run from any branch (Actions tab)
  workflow_dispatch:
jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs
            args: '--target x86_64-apple-darwin'
          # Oldest supported LTS on purpose: the binary links against this
          # runner's glibc, so an older base = wider distro compatibility.
          - platform: 'ubuntu-22.04'      # Linux x86_64
            args: ''
          - platform: 'ubuntu-22.04-arm'  # Linux ARM64
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install Pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
        targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

    - name: Install dependencies (ubuntu only)
      if: startsWith(matrix.platform, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libcairo2-dev \
          libxdo-dev \
          libssl-dev \
          patchelf \
          build-essential \
          file

    - name: Install frontend dependencies
      run: pnpm install

    # https://github.com/tauri-apps/tauri-action
    # macOS / Windows: build, bundle and upload to the draft release.
    - uses: tauri-apps/tauri-action@v0
      if: "!startsWith(matrix.platform, 'ubuntu')"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # macOS code signin, ignored on Windows
        APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      with:
        tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
        releaseName: 'v__VERSION__'
        releaseBody: 'See the assets to download this version and install.'
        releaseDraft: true
        prerelease: false
        includeUpdaterJson: true
        updaterJsonPreferNsis: true
        args: ${{ matrix.args }}

    # Linux: executable only (frontend embedded), no deb/rpm/AppImage. Published
    # as a workflow artifact (Actions tab), not on the release.
    - name: Build (Linux, no bundle)
      if: startsWith(matrix.platform, 'ubuntu')
      run: pnpm tauri build --no-bundle

    # Also publish the installers as workflow artifacts (Actions tab), even when
    # the release upload fails. Only the final installers: the bundle directories
    # also hold the unpacked trees (.app, staging).
    - name: Upload artifacts (macOS / Windows)
      if: always() && !startsWith(matrix.platform, 'ubuntu')
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.platform }}${{ contains(matrix.args, 'aarch64') && '-aarch64' || contains(matrix.args, 'x86_64') && '-x86_64' || '' }}
        if-no-files-found: warn
        path: |
          src-tauri/target/release/bundle/msi/*.msi
          src-tauri/target/release/bundle/nsis/*.exe
          src-tauri/target/*/release/bundle/dmg/*.dmg

    # Note: artifact zips do not keep the executable bit, so run
    # `chmod +x luma11y` after extracting.
    - name: Upload artifact (Linux executable)
      if: startsWith(matrix.platform, 'ubuntu')
      uses: actions/upload-artifact@v4
      with:
        name: linux-${{ runner.arch }}-bin
        if-no-files-found: error
        path: src-tauri/target/release/luma11y
